<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantry</title>
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="script.js" defer></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light px-3 sticky-top">
        <ul class="nav nav-pills flex-grow-1 justify-content-center">

            <li class="nav-item">
                <a class="nav-link active rounded-pill" aria-current="page" href="pantry.html">Pantry</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="index.html">Recipes</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="savedrecipes.html">Saved</a>
            </li>
        </ul>
    </nav>

    <section class="container mt-4">
        <h1 class="mb-4 text-center">Pantry</h1>
        <div class="row g-4">
            <div class="col-md-6">
                <div class="card h-100">
                    <div class="card-body">
                        <h4 class="card-title">Add an ingredient</h4>
                        <form id="pantry-ingredient-form">
                            <div class="mb-3">
                                <label for="pantry-ingredient-input" class="form-label">Ingredient</label>
                                <input type="text" id="pantry-ingredient-input" class="form-control" list="pantry-ingredient-options" placeholder="Start typing an ingredient" autocomplete="off" required>
                                <datalist id="pantry-ingredient-options"></datalist>
                            </div>
                            <div class="mb-3">
                                <label for="pantry-expiry-input" class="form-label">Expiry date</label>
                                <input type="date" id="pantry-expiry-input" class="form-control" required>
                            </div>
                            <button id="add-pantry-ingredient-button" type="submit" class="btn btn-primary" disabled>
                                <i class="bi bi-plus-lg"></i> Add to pantry
                            </button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card h-100">
                    <div class="card-body">
                        <h4 class="card-title">My ingredients</h4>
                        <p id="pantry-message" class="mb-3" role="status" aria-live="polite"></p>
                        <ul class="list-group" id="pantry-ingredient-list" aria-live="polite">
                            <li class="list-group-item">Your pantry is empty.</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
